<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      .icon {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        border-radius: 22%;
        background: linear-gradient(135deg, #b06bff 0%, #a855f7 42%, #ec4899 100%);
        box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0);
      }
      .icon::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 22%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 58%);
      }
      .glyph {
        position: relative;
        color: #ffffff;
        font-family: 'Yu Gothic UI', 'Meiryo', 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 60vmin;
        line-height: 1;
        transform: translateY(-1.5%);
        text-shadow: 0 0.02em 0.05em rgba(40, 0, 70, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="icon"><div class="glyph">ア</div></div>
  </body>
</html>
