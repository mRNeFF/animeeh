appId: com.axel.animeeh
productName: ANIMEEH
copyright: Copyright © 2026 Axel

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ANIMEEH
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

linux:
  target:
    - AppImage
  category: Utility

mac:
  target:
    - dmg
  category: public.app-category.entertainment

# Release feed consumed by electron-updater (see src/main/updater.ts).
# The repo is public on purpose: electron-updater queries it with no
# credentials, so a private repo could not be used without shipping a token.
publish:
  provider: github
  owner: mRNeFF
  repo: animeeh
  # electron-builder defaults to a draft release, which electron-updater cannot
  # see. Publish the release immediately so the update feed actually works.
  releaseType: release

