appId: com.axel.animeeh
productName: ANIMEEH
copyright: Copyright © 2026 Axel

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ANIMEEH

linux:
  target:
    - AppImage
  category: Utility

mac:
  target:
    - dmg
  category: public.app-category.entertainment
